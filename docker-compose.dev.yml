name: ${PROJECT_NAME:-docker-l4d2-competitive}

services:
  l4d2:
    build:
      dockerfile: Dockerfile
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-gameservermanagers/linuxgsm:ubuntu-26.04}
    image: l4d2-dev
    container_name: ${CONTAINER_NAME:-l4d2}
    pull_policy: always
    env_file:
      - .env
      - .env.secrets
    init: true
    stop_grace_period: 2m
    volumes:
      - data:/data
      - ssh:/var/lib/l4d2/ssh
      - ${HOST_REPO_RESOURCES_DIR:-./resources}:${REPO_RESOURCES_DIR:-/data/resources}:ro
    environment:
      - SSH_PORT=${SSH_PORT:-422}
      - L4D2_INSTALL=${L4D2_INSTALL:-normal}
      - L4D2_AUTOSTART=${L4D2_AUTOSTART:-true}
      - L4D2_UPDATER=${L4D2_UPDATER:-true}
      - STACK_PROFILE=${STACK_PROFILE:-default}
      - NPM_CONFIG_AUDIT=${NPM_CONFIG_AUDIT:-false}
    network_mode: host

volumes:
  ssh:
    name: ${SSH_VOLUME_NAME:-${DATA_VOLUME_NAME:-l4d2_data}_ssh}
  data:
    name: ${DATA_VOLUME_NAME:-l4d2_data}

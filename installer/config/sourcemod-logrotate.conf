# Optional administrator-installed policy. Never invoked by install/update.
# Closed SourceMod daily error files: preserve evidence for 90 rotations.
/data/serverfiles/left4dead2/addons/sourcemod/logs/errors_*.log /data/serverfiles/left4dead2/addons/.instance-data/*/logs/errors_*.log {
    daily
    minage 2
    rotate 90
    missingok
    notifempty
    compress
    delaycompress
    nocreate
    su linuxgsm linuxgsm
}
